[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-backtest"
version = "0.1.0"
description = "A local portfolio backtesting engine with Numba, SQLite, Parquet, and a FastAPI WebUI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numba>=0.61,<0.62",
  "numpy>=1.26,<2.1",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=16,<22",
  "pydantic>=2.5,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[project.scripts]
portfolio-backtest = "portfolio_backtest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_backtest = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
