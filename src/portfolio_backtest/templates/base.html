<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Portfolio Backtest{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <a class="wordmark" href="/">
      <span class="wordmark-mark" aria-hidden="true">PB</span>
      <span>Portfolio Ledger</span>
    </a>
    <nav aria-label="Primary">
      <ul class="nav-list">
        <li><a href="/">Runs</a></li>
        <li><a href="/#register-title">Compare</a></li>
      </ul>
    </nav>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Local research workspace. Results stay on this machine.</p>
  </footer>
  <p id="page-status" class="visually-hidden" role="status" aria-live="polite"></p>
  {% block scripts %}{% endblock %}
</body>
</html>
